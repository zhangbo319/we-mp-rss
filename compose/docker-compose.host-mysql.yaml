services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile.local
    image: we-mp-rss-backend:host-mysql-local
    container_name: we-mp-rss-backend-host-mysql
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB: mysql+pymysql://zhangbo:zhangbo@host.docker.internal:3306/we_mp_rss?charset=utf8mb4
      PROXY_ENABLED: "False"
    ports:
      - "8001:8001"
    volumes:
      - ../apis:/app/apis
      - ../core:/app/core
      - ../data:/app/data
      - ../driver:/app/driver
      - ../jobs:/app/jobs
      - ../migrations:/app/migrations
      - ../public:/app/public
      - ../schemas:/app/schemas
      - ../static:/app/static
      - ../tools:/app/tools
      - ../views:/app/views
      - ../main.py:/app/main.py
      - ../web.py:/app/web.py
      - ../init_sys.py:/app/init_sys.py
      - ../data_sync.py:/app/data_sync.py
      - ../job.py:/app/job.py
